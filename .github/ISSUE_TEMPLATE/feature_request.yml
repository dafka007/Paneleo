name: Feature request
description: Suggest an improvement to Paneleo
title: "[Feature] "
labels:
  - enhancement
body:
  - type: textarea
    id: feature
    attributes:
      label: Requested feature
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What problem would it solve?
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: How should it work?
    validations:
      required: true
  - type: textarea
    id: examples
    attributes:
      label: Examples or screenshots
      description: Optional references that help explain the request.
